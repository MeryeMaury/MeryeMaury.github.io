<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Accoglienza ospiti · M | M</title><link href="https://fonts.googleapis.com/css2?family=Italiana&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#44363a;--rose:#a56e7a;--line:#e9d8d8;--bg:#fbf7f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,sans-serif}header{text-align:center;background:#fff;border-bottom:1px solid var(--line);padding:26px 16px}header .monogram{font:32px Italiana,serif;color:var(--rose)}h1,h2{font-family:Italiana,serif;font-weight:400}h1{font-size:34px;margin:10px 0 4px}header p{font-size:13px;color:#85777a;margin:0}.wrap{max-width:1050px;margin:auto;padding:24px 16px 70px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 28px #715a5b0c}#login{max-width:430px;margin:45px auto}label{font-size:12px;font-weight:700;display:block;margin:14px 0 7px}input{width:100%;border:1px solid #decbd0;border-radius:10px;padding:14px;font:inherit;background:#fff;min-width:0}input:focus{outline:2px solid #d9abb5}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--rose);color:#fff;font-weight:700}button.secondary{background:#f5ebed;color:var(--ink)}button:disabled{opacity:.5}.pw{display:flex;gap:8px}.pw input{flex:1}.muted{font-size:13px;color:#847579}.error{color:#a03948;font-size:13px}.hidden{display:none!important}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.toolbar input{flex:1;min-width:200px}.stats{font-size:13px;color:#77686b;margin-bottom:18px}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}.person{background:white;border:1px solid var(--line);border-radius:14px;padding:16px}.person strong{display:block;font-size:15px;overflow-wrap:anywhere}.person .table{margin-top:8px;font-size:15px;color:#98616f;font-weight:700}.person .seat{font-size:12px;color:#7c6c70;margin-top:3px}.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}.tablecard{background:white;border:1px solid var(--line);border-radius:16px;padding:18px}.tablecard h2{font-size:26px;margin:0 0 6px}.tablecard .count{font-size:12px;color:#8b7c7e}.tablecard ol{padding-left:22px;margin-bottom:0}.tablecard li{padding:7px 0;border-bottom:1px solid #f5eff0;font-size:14px}.tablecard li:last-child{border:0}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{flex:1}.empty{padding:24px;text-align:center;color:#827579}.footnote{margin-top:22px;font-size:12px;color:#8b7c7e;text-align:center}@media(max-width:540px){h1{font-size:30px}.wrap{padding:16px 12px 50px}.card{padding:18px}.toolbar button{width:100%}}
</style></head><body><header><div class="monogram">M | M</div><h1>Accoglienza ospiti</h1><p>Mariangela &amp; Maurizio · 6 agosto 2027</p></header><main class="wrap"><section id="login" class="card"><h2>Accesso hostess</h2><p class="muted">Accesso riservato al personale di accoglienza.</p><form id="form"><label for="password">Codice di accesso</label><div class="pw"><input id="password" type="password" autocomplete="off" required><button type="button" id="eye" class="secondary">Mostra</button></div><p><button type="submit" style="width:100%">Accedi</button></p><div id="loginmsg" class="error" role="status"></div></form></section><section id="app" class="hidden"><div class="toolbar"><input id="search" type="search" placeholder="Cerca un invitato per nome o cognome…" aria-label="Cerca invitato"><button id="refresh" class="secondary">Aggiorna</button><button id="logout" class="secondary">Esci</button></div><div class="stats" id="stats"></div><div class="tabs"><button id="tabSearch">Cerca invitati</button><button id="tabTables" class="secondary">Elenco tavoli</button></div><section id="people"><div class="results" id="results"></div></section><section id="tableSection" class="hidden"><div class="tables" id="tables"></div></section><p class="footnote">Consultazione in sola lettura · Non condividere il codice con gli invitati</p></section></main><script>
const ENDPOINT='https://helhiadzfltxtfsehtoo.supabase.co/functions/v1/hostess-access';
const ANON_KEY='sb_publishable_CfGUvVgO6QkaDzzTkuNFgw_NRt1Iyck';
const $=id=>document.getElementById(id);let guests=[],tables=[],mode='search';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const code=sessionStorage.getItem('mm_hostess_code');if(!code)return;try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','apikey':ANON_KEY},body:JSON.stringify({code})});const data=await r.json();if(!r.ok)throw Error(data.error||'Accesso non riuscito');guests=data.guests||[];tables=data.tables||[];$('login').classList.add('hidden');$('app').classList.remove('hidden');$('loginmsg').textContent='';render();}catch(e){sessionStorage.removeItem('mm_hostess_code');$('login').classList.remove('hidden');$('app').classList.add('hidden');$('loginmsg').textContent=e.message;}}
function tableName(id){return tables.find(t=>t.id===id)?.name||'Tavolo '+id;}
function render(){const q=$('search').value.trim().toLocaleLowerCase('it');const filtered=guests.filter(g=>g.full_name.toLocaleLowerCase('it').includes(q));$('stats').textContent=`${guests.length} invitati · ${guests.filter(g=>g.table_id!==null).length} assegnati · Ultimo aggiornamento: ${new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}`;$('results').innerHTML=filtered.length?filtered.map(g=>`<article class="person"><strong>${esc(g.full_name)}</strong><div class="table">${g.table_id!==null?esc(tableName(g.table_id)):'Tavolo non ancora assegnato'}</div>${g.seat_no!==null?`<div class="seat">Posto ${Number(g.seat_no)}</div>`:''}</article>`).join(''):'<div class="empty">Nessun invitato trovato.</div>';$('tables').innerHTML=tables.map(t=>{const ppl=guests.filter(g=>g.table_id===t.id).sort((a,b)=>(a.seat_no||0)-(b.seat_no||0));return `<article class="tablecard"><h2>${esc(t.name)}</h2><div class="count">${ppl.length} invitati</div>${ppl.length?`<ol>${ppl.map(g=>`<li>${esc(g.full_name)}${g.seat_no!==null?` <span class="muted">· posto ${Number(g.seat_no)}</span>`:''}</li>`).join('')}</ol>`:'<p class="muted">Nessun invitato assegnato</p>'}</article>`}).join('');setMode(mode);}
function setMode(m){mode=m;$('people').classList.toggle('hidden',m!=='search');$('tableSection').classList.toggle('hidden',m!=='tables');$('tabSearch').classList.toggle('secondary',m!=='search');$('tabTables').classList.toggle('secondary',m!=='tables');}
$('form').onsubmit=async e=>{e.preventDefault();$('loginmsg').textContent='Verifica codice…';sessionStorage.setItem('mm_hostess_code',$('password').value);$('password').value='';await load();};
$('eye').onclick=()=>{const p=$('password');p.type=p.type==='password'?'text':'password';$('eye').textContent=p.type==='password'?'Mostra':'Nascondi';};
$('logout').onclick=()=>{sessionStorage.removeItem('mm_hostess_code');guests=[];tables=[];$('login').classList.remove('hidden');$('app').classList.add('hidden');};
$('refresh').onclick=load;$('search').oninput=()=>{setMode('search');render();};$('tabSearch').onclick=()=>setMode('search');$('tabTables').onclick=()=>setMode('tables');
if(sessionStorage.getItem('mm_hostess_code'))load();
</script></body></html>
