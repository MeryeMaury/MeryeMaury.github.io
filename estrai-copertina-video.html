<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estrai copertina Save the Date</title><style>body{font:16px/1.5 system-ui;background:#fbf7f3;color:#583e42;max-width:720px;margin:50px auto;padding:20px}button,input{font:inherit;margin:12px 0}button{padding:12px 20px;background:#9a696d;color:white;border:0;border-radius:8px}video,canvas{width:100%;max-width:100%;display:block;margin:15px 0}p{color:#755d60}</style></head><body><h1>Copertina dal video</h1><p>Apri questo file sul computer, seleziona il tuo MP4 e premi «Estrai ultimo fotogramma». Tutto avviene localmente: il video non viene caricato online.</p><input type="file" id="file" accept="video/mp4,video/*"><video id="v" controls playsinline preload="auto"></video><button id="extract" disabled>Estrai ultimo fotogramma</button><canvas id="canvas" width="1200" height="630"></canvas><a id="download" hidden download="save-the-date-cover.jpg">Scarica copertina JPG</a><p id="status"></p><script>const file=document.querySelector('#file'),v=document.querySelector('#v'),btn=document.querySelector('#extract'),canvas=document.querySelector('#canvas'),status=document.querySelector('#status'),a=document.querySelector('#download');let url;file.onchange=()=>{if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file.files[0]);v.src=url;btn.disabled=false;status.textContent='Video caricato.'};btn.onclick=async()=>{btn.disabled=true;status.textContent='Cerco l’ultimo fotogramma…';try{if(!Number.isFinite(v.duration))await new Promise((resolve,reject)=>{v.onloadedmetadata=resolve;v.onerror=reject});v.currentTime=Math.max(0,v.duration-0.15);await new Promise((resolve,reject)=>{v.onseeked=resolve;v.onerror=reject});const ctx=canvas.getContext('2d');const w=canvas.width,h=canvas.height;ctx.fillStyle='#fbf7f3';ctx.fillRect(0,0,w,h);const scale=Math.max(w/v.videoWidth,h/v.videoHeight),dw=v.videoWidth*scale,dh=v.videoHeight*scale;ctx.drawImage(v,(w-dw)/2,(h-dh)/2,dw,dh);canvas.toBlob(blob=>{if(!blob){status.textContent='Errore creazione JPG';return}a.href=URL.createObjectURL(blob);a.hidden=false;a.textContent='Scarica save-the-date-cover.jpg';status.textContent='Copertina pronta. Scaricala e caricala su GitHub sostituendo il file precedente.'},'image/jpeg',0.93)}catch(e){status.textContent='Non riesco a leggere il fotogramma: '+e.message}finally{btn.disabled=false}};</script></body></html>
