<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<script>
(()=>{
 const v=document.getElementById('video');
 const film=document.getElementById('film');
 const b=document.getElementById('play');
 const hint=document.getElementById('videoHint');
 let recorded=false;
 async function countPlay(){
  if(recorded || sessionStorage.getItem('mm_save_date_played'))return;
  recorded=true;
  try{
   const client=window.supabase?.createClient('https://helhiadzfltxtfsehtoo.supabase.co','sb_publishable_CfGUvVgO6QkaDzzTkuNFgw_NRt1Iyck',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
   if(!client)throw new Error('Libreria statistiche non disponibile');
   const {error}=await client.rpc('mm_record_save_date_play');
   if(error)throw error;
   sessionStorage.setItem('mm_save_date_played','1');
  }catch(e){recorded=false;console.warn('Statistiche non registrate:',e.message)}
 }
 function fullscreen(){
  // Su Safari iOS il video usa la propria modalità fullscreen nativa.
  if(typeof v.webkitEnterFullscreen==='function'){
   try{v.webkitEnterFullscreen();return}catch(e){}
  }
  if(typeof v.requestFullscreen==='function'){
   try{const result=v.requestFullscreen();if(result?.catch)result.catch(()=>{});}catch(e){}
  }
 }
 async function start(){
  film.classList.add('started');v.preload='auto';v.controls=true;
  v.muted=false;
  // La richiesta avviene nel gesto dell'utente, non dopo await.
  const playback=v.play();
  fullscreen();
  try{await playback}catch(e){hint.textContent='Tocca Play nei controlli del video per iniziare.'}
 }
 b.addEventListener('click',start);
 v.addEventListener('play',()=>{void countPlay()});
 v.addEventListener('ended',()=>{
  if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
  if(typeof v.webkitExitFullscreen==='function')try{v.webkitExitFullscreen()}catch(e){}
  v.controls=true;
  hint.textContent='♡';
 });
 v.addEventListener('error',()=>{
  if(v.error)hint.textContent='Video non disponibile: verifica il percorso di save-the-date.mp4.';
 });
})();
</script>
