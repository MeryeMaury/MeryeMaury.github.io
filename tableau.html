<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Tableau · Il nostro viaggio più bello · M | M</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Italiana&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--rose:#875a69;--ink:#513946;--gold:#bb9159}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{font-family:Manrope,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 0,#fff9f2,#f4e3dd 75%,#e9c9c2);overflow:hidden}.shell{height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative}.shell:before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.23;background:radial-gradient(circle at 12% 25%,#fff 0 8%,transparent 23%),radial-gradient(circle at 88% 67%,#fff 0 9%,transparent 24%)}header{position:relative;text-align:center;flex:none;padding:clamp(5px,1vh,14px) 2vw 0}.monogram{font:clamp(23px,3.2vh,48px) Italiana,serif;letter-spacing:.12em;color:#996b57}h1{font:clamp(25px,4.5vh,68px) Italiana,serif;margin:0;line-height:1.08;color:#795363}.date{font-size:clamp(10px,1.2vh,16px);letter-spacing:.24em;margin:3px 0;color:#a47778}.intro{font-size:clamp(10px,1.3vh,17px);margin:2px 0 0;color:#9b7477}.screen{position:relative;flex:1;min-height:0;padding:clamp(5px,.8vh,12px) clamp(8px,1.4vw,26px) clamp(7px,1vh,14px)}.grid{height:100%;display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));grid-template-rows:repeat(var(--rows,4),minmax(0,1fr));gap:clamp(4px,.65vw,12px)}.destination{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;border:1px solid #d5ac88;border-radius:clamp(7px,1.1vh,17px);background:linear-gradient(150deg,#fffefa,#fff5ed);box-shadow:0 3px 11px #7c4c4a1a, inset 0 0 0 2px #fff9e8}.art{height:var(--art,39%);min-height:0;flex:none;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(130deg,#f8e9df,#fdf4e6)}.art img{width:100%;height:100%;object-fit:contain;object-position:center center;display:block;filter:saturate(.92) contrast(1.02)}.art:after{content:'';position:absolute;inset:auto 0 0;height:12%;background:linear-gradient(transparent,#fffaf4);pointer-events:none}.destination h2{font:clamp(12px,1.55vw,28px) Italiana,serif;color:#79505c;text-align:center;line-height:1.1;margin:clamp(2px,.4vh,7px) 4px clamp(1px,.2vh,4px);letter-spacing:.025em;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.names{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0 4px 4px;gap:var(--name-gap,2px)}.guest{font-size:var(--name-size,clamp(10px,1.05vw,19px));line-height:1.13;min-height:0;max-width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#59444a;font-weight:600;position:relative}.guest.enter{animation:arrival .65s ease-out both}.spark{position:absolute;inset:-12px -18px;pointer-events:none;overflow:visible}.spark i{font-style:normal;position:absolute;color:#c79b4e;font-size:clamp(12px,1.6vw,24px);animation:sparkle 1.4s ease-out forwards}.spark i:nth-child(1){left:3%;top:4%}.spark i:nth-child(2){right:3%;top:12%;animation-delay:.12s}.spark i:nth-child(3){left:21%;bottom:-5%;animation-delay:.22s}.spark i:nth-child(4){right:22%;bottom:0;animation-delay:.08s}@keyframes arrival{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@keyframes sparkle{0%{opacity:0;transform:translateY(4px) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translateY(-18px) scale(1.2)}}.empty{margin:auto;color:#c5aaa4;font-size:clamp(12px,1.2vw,18px)}.welcome{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,#fff9f4,#f2ded7);z-index:5;padding:5vw}.welcome-inner{border:1px solid #cbaaa4;padding:5vh 7vw;border-radius:24px;box-shadow:0 14px 60px #9b77702a;background:#fff9f0c9}.welcome h2{font:clamp(38px,7vw,100px) Italiana,serif;color:#815c67;margin:2vh 0}.welcome p{font-size:clamp(15px,2vw,28px);color:#987c80}.hidden{display:none!important}.tools{position:absolute;bottom:10px;right:12px;z-index:10;opacity:.13;transition:opacity .2s}.tools:hover,.tools:focus-within{opacity:1}.tools button{font:12px Manrope,sans-serif;border:1px solid #a97d83;background:#fff9f5;color:#7b5360;border-radius:8px;padding:8px;cursor:pointer}.error{position:absolute;top:6px;left:8px;color:#a53243;font-size:12px;z-index:12;background:#fff8f2c9}.status{position:absolute;bottom:4px;left:12px;color:#b49892;font-size:10px;z-index:1}.spotlight{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);min-width:min(620px,75vw);max-width:85vw;background:#fffaf4f5;border:2px solid #d6b78d;border-radius:25px;box-shadow:0 20px 90px #63434e77;text-align:center;padding:clamp(15px,3vh,35px);pointer-events:none;animation:spotIn .35s ease-out both}.spotlight strong{display:block;font:clamp(35px,5vw,78px) Italiana,serif;color:#744b5d}.spotlight span{font:clamp(17px,2vw,32px) Italiana,serif;color:#a47c58}.spotlight img{width:min(230px,30vw);height:min(120px,15vh);object-fit:contain;border-radius:14px;margin-bottom:8px}@keyframes spotIn{from{opacity:0;transform:translate(-50%,-45%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@media(prefers-reduced-motion:reduce){.guest.enter,.spark i,.spotlight{animation:none!important}.spark{display:none}}@media(max-aspect-ratio:1/1){header{padding-top:5px}.destination h2{font-size:clamp(11px,2vw,20px)}.art{height:32%}.guest{font-size:var(--name-size,12px)}}

/* Leggibilita costante: 4 destinazioni per schermata, mai ridimensionare i nomi in base al numero di ospiti. */
.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(0,1fr))!important;gap:clamp(10px,1.2vw,24px)}
.destination{display:none}.destination.page-visible{display:flex}
.art{height:clamp(65px,13vh,145px)!important}
.destination h2{font-size:clamp(21px,2.15vw,37px);margin:4px 5px 5px}
.names{gap:clamp(2px,.35vh,5px);overflow:auto;scrollbar-width:thin;padding:0 8px 9px}
.guest{font-size:clamp(17px,1.45vw,26px)!important;line-height:1.25;flex:none;overflow:visible;text-overflow:clip;white-space:normal;overflow-wrap:break-word}
.page-controls{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;z-index:9;padding:5px 12px;border-radius:30px;background:#fff9f0e8;border:1px solid #d8bbb0;color:#795363;font:600 13px Manrope,sans-serif}
.page-controls button{border:0;background:#865b6a;color:white;border-radius:50%;width:30px;height:30px;font-size:20px;cursor:pointer}
.screen{padding-bottom:52px}
@media(max-width:700px){.art{height:clamp(48px,10vh,100px)!important}.guest{font-size:clamp(15px,2vw,19px)!important}.destination h2{font-size:clamp(18px,3vw,25px)}}
</style></head><body><div class="shell"><header><div class="monogram">M | M</div><h1>Il nostro viaggio più bello</h1><div class="date">6 AGOSTO 2027</div><p class="intro">Ogni destinazione, un incontro speciale</p></header><main class="screen"><div id="grid" class="grid"></div><section id="welcome" class="welcome"><div class="welcome-inner"><div class="monogram">M | M</div><h2>La nostra storia continua…</h2><p>Il vostro posto sta per essere svelato</p></div></section><div id="spotlight" class="spotlight hidden" aria-live="polite"></div><div id="error" class="error" role="status"></div><div class="status" id="status"></div><div class="page-controls hidden" id="pageControls"><button id="prevPage" aria-label="Pagina precedente">‹</button><span id="pageCount">1 / 5</span><button id="nextPage" aria-label="Pagina successiva">›</button></div><div class="tools"><button id="fullscreen" type="button">⛶ Schermo intero</button></div></main></div>
<script>
const ENDPOINT='https://helhiadzfltxtfsehtoo.supabase.co/functions/v1/tableau-live';
const APIKEY='sb_publishable_CfGUvVgO6QkaDzzTkuNFgw_NRt1Iyck';
const DEST=['Parigi','New York','Kyoto','Bali','Santorini','Maldive','Londra','Capri','Dubai','Marrakech','Tulum','Islanda','Rio de Janeiro','Tokyo','Amalfi','Havana','Cape Town','Sydney','Bora Bora'];
const slug=s=>s.toLowerCase().replaceAll(' ','-');
const $=id=>document.getElementById(id);
const guestKey=x=>x.id!=null?String(x.id):[x.full_name,x.table_id,x.seat_no].map(v=>String(v??'')).join('::');
let data=null,busy=false,seen=new Set(),initialized=false,startedBefore=false,spotTimer=null;let page=0,holdUntil=0;const PAGE_SIZE=4;
async function getState(){const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','apikey':APIKEY},body:JSON.stringify({action:'state',role:'projector'}),cache:'no-store'});const v=await r.json();if(!r.ok)throw Error(v.error||'Connessione non riuscita');return v;}
function layout(){showPage(page)}
function showPage(index){const cards=[...$('grid').children];const pages=Math.ceil(cards.length/PAGE_SIZE);page=((index%pages)+pages)%pages;cards.forEach((card,i)=>card.classList.toggle('page-visible',Math.floor(i/PAGE_SIZE)===page));$('pageCount').textContent=`${page+1} / ${pages}`;}
function nextPage(step=1){showPage(page+step);holdUntil=Date.now()+18000;}
function buildCards(){const grid=$('grid');DEST.forEach((name,i)=>{const card=document.createElement('article');card.className='destination';card.dataset.index=i;const art=document.createElement('div');art.className='art';const img=document.createElement('img');img.src='tableau_assets/'+slug(name)+'.webp';img.alt='Illustrazione 3D di '+name;img.loading='eager';art.append(img);const h=document.createElement('h2');h.textContent=name;const list=document.createElement('div');list.className='names';card.append(art,h,list);grid.append(card)});layout();}
function sparkle(el){const layer=document.createElement('span');layer.className='spark';layer.setAttribute('aria-hidden','true');for(let i=0;i<4;i++){const star=document.createElement('i');star.textContent=i%2?'✧':'✦';layer.append(star)}el.append(layer);el.classList.add('enter');setTimeout(()=>{layer.remove();el.classList.remove('enter')},1550)}
function spotlight(guest,tableName){const el=$('spotlight');el.replaceChildren();const index=(data.tables||[]).findIndex(t=>String(t.id)===String(guest.table_id));if(index>=0){const img=document.createElement('img');img.src='tableau_assets/'+slug(DEST[index%DEST.length])+'.webp';img.alt='';el.append(img)}const name=document.createElement('strong');name.textContent=guest.full_name;const loc=document.createElement('span');loc.textContent=tableName;el.append(name,loc);el.classList.remove('hidden');clearTimeout(spotTimer);spotTimer=setTimeout(()=>el.classList.add('hidden'),4200)}
function render(){if(!data)return;const running=!!data.started;$('welcome').classList.toggle('hidden',running);$('grid').classList.toggle('hidden',!running);$('pageControls').classList.toggle('hidden',!running);$('status').textContent=running?'Tableau in diretta':'';if(!running){$('spotlight').classList.add('hidden');clearTimeout(spotTimer);seen.clear();initialized=false;startedBefore=false;return}const all=data.guests||[];const current=new Set(all.map(guestKey));const newcomers=[];const cards=[...$('grid').children];(data.tables||[]).forEach((t,index)=>{const card=cards[index];if(!card)return;const list=card.querySelector('.names');const ppl=all.filter(g=>String(g.table_id)===String(t.id)).sort((a,b)=>(a.seat_no??0)-(b.seat_no??0));const existing=new Map([...list.querySelectorAll('.guest')].map(x=>[x.dataset.key,x]));for(const g of ppl){const key=guestKey(g);let el=existing.get(key);if(!el){el=document.createElement('div');el.className='guest';el.dataset.key=key;el.textContent=g.full_name;list.append(el);if(initialized&&!seen.has(key)){sparkle(el);newcomers.push({guest:g,table:DEST[index%DEST.length]})}}else if(el.firstChild?.nodeValue!==g.full_name){el.firstChild.nodeValue=g.full_name}existing.delete(key)}for(const el of existing.values())el.remove();if(!ppl.length){if(!list.querySelector('.empty')){const em=document.createElement('div');em.className='empty';em.textContent='✧';list.append(em)}}else list.querySelector('.empty')?.remove()});seen=current;const wasInitialized=initialized;initialized=true;startedBefore=true;layout();if(wasInitialized&&newcomers.length){const latest=newcomers[newcomers.length-1];const idx=(data.tables||[]).findIndex(t=>String(t.id)===String(latest.guest.table_id));if(idx>=0)showPage(Math.floor(idx/PAGE_SIZE));holdUntil=Date.now()+16000;spotlight(latest.guest,latest.table)}}
async function refresh(){if(busy||document.hidden)return;busy=true;try{data=await getState();$('error').textContent='';render()}catch(e){$('error').textContent='Collegamento tableau: '+e.message}finally{busy=false}}
$('prevPage').onclick=()=>nextPage(-1);$('nextPage').onclick=()=>nextPage(1);setInterval(()=>{if(data?.started&&Date.now()>holdUntil)showPage(page+1)},20000);$('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();window.addEventListener('resize',layout);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});buildCards();refresh();setInterval(refresh,2500);
</script></body></html>
