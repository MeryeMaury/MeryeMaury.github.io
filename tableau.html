<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Tableau in diretta · M | M</title><style>@import url('https://fonts.googleapis.com/css2?family=Italiana&family=Manrope:wght@400;500;600&display=swap');*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#fff 0%,#f9f0ed 80%);color:#674d57;font-family:Manrope,sans-serif;min-height:100vh}header{text-align:center;padding:3vh 20px 1vh}.logo{font:clamp(26px,3vw,42px) Italiana,serif;color:#a56e7a}h1{font:clamp(40px,5vw,75px) Italiana,serif;margin:10px}h2{font:clamp(21px,2vw,32px) Italiana,serif;margin:0 0 10px}main{padding:10px 3vw 5vh}.hidden{display:none!important}.login{max-width:430px;margin:9vh auto;background:white;border:1px solid #e6cdd2;border-radius:20px;padding:25px}input{padding:13px;border:1px solid #d9c5cb;border-radius:10px;font:inherit;width:100%;margin-bottom:10px}button{background:#a56e7a;color:white;border:0;border-radius:10px;padding:12px 18px;font:inherit;cursor:pointer}.error{color:#9d3045;text-align:center}.welcome{height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.welcome h2{font-size:clamp(40px,6vw,90px)}.welcome p{font-size:clamp(15px,1.6vw,25px)}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.1vw}.table{min-height:140px;background:#fffdfc;border:1px solid #e8d5d9;border-radius:14px;padding:1.2vw;box-shadow:0 5px 25px #9b738018}.table h2{text-align:center;border-bottom:1px solid #efdee2;padding-bottom:8px}.table ol{margin:0;padding-left:22px}.table li{font-size:clamp(11px,1.05vw,19px);margin:5px 0;animation:reveal .65s ease both;overflow-wrap:anywhere}.placeholder{text-align:center;color:#c4a7b1;font-size:13px;padding:8px}.muted{color:#977e87;font-size:13px;text-align:center}.tools{position:fixed;bottom:10px;right:12px;display:flex;gap:7px;opacity:.25}.tools:hover{opacity:1}@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.table{padding:14px}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><header><div class="logo">M | M</div><h1>Il nostro tableau</h1><div>6 agosto 2027</div></header><main><section id="login" class="login"><h2>Accesso proiettore</h2><p>Inserisci il codice hostess per collegare lo schermo.</p><form id="access"><input id="pass" type="password" placeholder="Codice di accesso" required><button type="submit">Collega proiettore</button><button type="button" id="eye">Mostra</button></form></section><div id="msg" class="error"></div><section id="app" class="hidden"><div id="welcome" class="welcome"><div class="logo">M | M</div><h2>La nostra storia continua…</h2><p>Il vostro posto nella nostra storia sta per essere svelato.</p></div><div id="revealed" class="hidden"><div class="muted" id="counter"></div><div id="grid" class="grid"></div></div><div class="tools"><button id="full">Schermo intero</button><button id="out">Esci</button></div></section></main><script>const ROLE='projector';
const ENDPOINT='https://helhiadzfltxtfsehtoo.supabase.co/functions/v1/tableau-live';
const APIKEY='sb_publishable_CfGUvVgO6QkaDzzTkuNFgw_NRt1Iyck';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let code=sessionStorage.getItem('mm_tableau_code')||'',data={guests:[],tables:[],revealed:[],started:false,revision:0},busy=false;
async function api(action='state',payload={}){const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','apikey':APIKEY},body:JSON.stringify({code,action,role:ROLE,...payload}),cache:'no-store'});let v;try{v=await r.json()}catch{throw Error('Risposta non valida dal server')}if(!r.ok)throw Error(v.error||'Errore di connessione');return v;}
function tname(id){return data.tables.find(t=>t.id===id)?.name||'Tavolo '+id;}
async function refresh(){if(!code||busy||document.hidden)return;busy=true;try{data=await api();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('msg').textContent='';render()}catch(e){$('msg').textContent=e.message;if(/codice|tentativi|autorizzat/i.test(e.message)){code='';sessionStorage.removeItem('mm_tableau_code');$('login').classList.remove('hidden');$('app').classList.add('hidden');}}finally{busy=false}}
$('access').onsubmit=async e=>{e.preventDefault();code=$('pass').value.trim();$('pass').value='';sessionStorage.setItem('mm_tableau_code',code);await refresh()};
$('eye').onclick=()=>{$('pass').type=$('pass').type==='password'?'text':'password'};
function logout(){sessionStorage.removeItem('mm_tableau_code');code='';$('login').classList.remove('hidden');$('app').classList.add('hidden')}
setInterval(refresh,2500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});if(code)refresh();
$('full').onclick=()=>document.documentElement.requestFullscreen?.();$('out').onclick=logout;
let previous=new Set();function render(){const visible=data.started;$('welcome').classList.toggle('hidden',visible);$('revealed').classList.toggle('hidden',!visible);if(!visible){previous=new Set();return}const g=data.guests||[];$('counter').textContent=g.length+' posti svelati';$('grid').innerHTML=data.tables.map(t=>{const ppl=g.filter(x=>x.table_id===t.id).sort((a,b)=>a.seat_no-b.seat_no);return `<article class="table"><h2>${esc(t.name)}</h2>${ppl.length?`<ol>${ppl.map(x=>`<li>${esc(x.full_name)} <span style="opacity:.55">· ${x.seat_no}</span></li>`).join('')}</ol>`:'<div class="placeholder">✧</div>'}</article>`}).join('');}
</script></body></html>
