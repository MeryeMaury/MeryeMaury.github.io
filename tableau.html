 function clear(a){if(!a||a.done)return;a.done=true;clearTimeout(a.delay);clearTimeout(a.limit);clearTimeout(a.settle);if(a.btn?.isConnected){a.btn.classList.remove('mm-action-pending','mm-action-tap');a.btn.removeAttribute('data-mm-loading')}if(current===a){current=null;status.classList.remove('mm-show')}}
 function start(btn){if(!btn||btn.disabled||btn.getAttribute('aria-disabled')==='true')return;
  if(current&&current.btn===btn&&!current.done)return;
  const a={id:++serial,btn,pending:0,done:false,started:performance.now()};current=a;mount();btn.classList.add('mm-action-tap');
  a.delay=setTimeout(()=>{if(a.done)return;btn.classList.add('mm-action-pending');btn.dataset.mmLoading='true';status.classList.add('mm-show')},220);
  a.limit=setTimeout(()=>{if(!a.done){clear(a);status.querySelector('span:last-child').textContent='Connessione lenta: verifica il risultato';status.classList.add('mm-show');setTimeout(()=>{status.classList.remove('mm-show');status.querySelector('span:last-child').textContent='Caricamento…'},2500)}},18000);
  // Lascia una finestra breve per l'avvio di operazioni asincrone.
  a.settle=setTimeout(()=>{if(a.pending===0)clear(a)},900);
 }
 document.addEventListener('click',e=>{const btn=e.target.closest('button,input[type="submit"],input[type="button"],a[href]');if(!btn||btn.disabled)return;
  // Link e azioni istantanee hanno solo conferma visiva, non un caricamento fittizio.
  if(btn.matches('a[href]')){btn.classList.add('mm-action-tap');setTimeout(()=>btn.classList.remove('mm-action-tap'),250);return}
  start(btn);
 },true);
 document.addEventListener('submit',e=>{const btn=e.submitter||e.target.querySelector('button[type="submit"],input[type="submit"]');if(btn&&(!current||current.btn!==btn))start(btn)},true);
 window.fetch=function(...args){const a=current;
  // Associa alla pressione solo le richieste iniziate subito dopo il tocco.
  const tracked=a&&!a.done&&performance.now()-a.started<1800;
  if(tracked){a.pending++;clearTimeout(a.settle)}
  let promise;try{promise=nativeFetch(...args)}catch(err){if(tracked&&--a.pending===0)clear(a);throw err}
  if(tracked)return promise.finally(()=>{a.pending--;if(a.pending===0){a.settle=setTimeout(()=>clear(a),320)}});
  return promise;
 };
})();
